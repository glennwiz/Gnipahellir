<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gnipahellir Board</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0c0a0e; color: #cfc8bd;
    font: 13px/1.5 Consolas, "Cascadia Mono", monospace;
    height: 100vh; display: flex; flex-direction: column;
    position: relative;
  }
  header {
    padding: 10px 14px; border-bottom: 1px solid #2a2028;
    display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap;
  }
  header h1 { font-size: 14px; color: #e8543a; letter-spacing: 2px; font-weight: bold; }
  #stats { color: #6f6660; }
  #roster { color: #8f857c; }
  #roster b { font-weight: normal; }
  .rkill {
    cursor: pointer; color: #a05248; padding: 0 3px; border-radius: 3px;
  }
  .rkill:hover { color: #ff8878; background: #2a1512; }
  .rrel {
    cursor: pointer; color: #7a8a5d; padding: 0 3px; border-radius: 3px;
  }
  .rrel:hover { color: #c9e08a; background: #1d2412; }
  #log { flex: 1; overflow-y: auto; padding: 10px 14px; }
  .m { padding: 3px 0; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .m:hover { background: #14101a; }
  /* A multi-line or long post drops its text onto its own full-width line
     under the metadata — the inline column was ~300px in from the left, so
     long posts wrapped into a tall unreadable ribbon. Short one-liners keep
     the dense inline look. */
  .m.block { padding: 7px 0; }
  .m.block .txt, .m.block .more {
    flex: 0 0 100%; border-left: 2px solid #2a2028; padding-left: 9px; margin-top: 2px;
  }
  .m.block .txt.clip { max-height: 16em; overflow: hidden; }
  .ln { white-space: pre-wrap; }
  .blank { height: 7px; }
  /* Hanging indent: the marker is its own flex item, so wrapped list text
     lines up under the text rather than under the bullet. */
  .li { display: flex; gap: 6px; }
  .li .mark { flex-shrink: 0; color: #8a7f74; }
  .more { cursor: pointer; color: #6aa5d8; font-size: 11px; }
  .more:hover { color: #9ccbf0; }
  .t { color: #56505a; flex-shrink: 0; }
  .seq { color: #56505a; flex-shrink: 0; min-width: 34px; text-align: right; }
  .agent { flex-shrink: 0; font-weight: bold; }
  .kind { flex-shrink: 0; padding: 0 6px; border-radius: 3px; font-size: 11px; }
  .kind.status  { background: #1a2733; color: #6aa5d8; }
  .kind.msg     { background: #241f2b; color: #a99bb8; }
  .kind.request { background: #33210f; color: #e0a153; }
  .kind.reply   { background: #16291a; color: #7dc687; }
  .kind.release { background: #1d2412; color: #7a8a5d; }
  .to { color: #e0a153; flex-shrink: 0; }
  .txt { white-space: pre-wrap; word-break: break-word; }
  .files { color: #5d7b5d; font-size: 11px; }
  /* A request taken up by an `anyone` accept - patched onto the ORIGINAL
     request's row, possibly after it already rendered. */
  .accepted { color: #7dc687; font-size: 11px; flex-shrink: 0; }
  /* A message bound to a work item: jumps to and flashes that task's row. */
  .tasklink {
    cursor: pointer; color: #6aa5d8; font-size: 11px; flex-shrink: 0;
    border: 1px solid #223040; border-radius: 3px; padding: 0 4px;
  }
  .tasklink:hover { background: #14202c; }
  .task-flash { animation: taskflash 1.4s ease-out; }
  @keyframes taskflash { from { background: #1a2733; } to { background: transparent; } }
  footer {
    display: flex; gap: 8px; padding: 10px 14px;
    border-top: 1px solid #2a2028; background: #0f0c12;
  }
  input, select, button {
    background: #17131c; color: #cfc8bd; border: 1px solid #322a38;
    font: inherit; padding: 5px 8px; border-radius: 3px;
  }
  input:focus, select:focus { outline: none; border-color: #e8543a; }
  #name { width: 90px; }
  #text { flex: 1; }
  button { background: #3a1712; color: #e8886f; cursor: pointer; }
  button:hover { background: #55201a; }
  #warn { color: #e0a153; padding: 0 14px 6px; display: none; }
  #tasktoggle { cursor: pointer; color: #e0a153; }
  #tasktoggle:hover { color: #f0b873; }
  #tasks {
    display: none; border-bottom: 1px solid #2a2028; padding: 8px 14px;
    max-height: 40vh; overflow-y: auto; background: #0f0c12;
  }
  .task { padding: 4px 0; border-bottom: 1px solid #1a1620; }
  .task:last-child { border-bottom: none; }
  .trow { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .task .tid { color: #56505a; min-width: 30px; text-align: right; flex-shrink: 0; }
  .task .ttext { flex: 1; min-width: 160px; }
  /* State chip - the v3 lifecycle. `status` (open/doing/done) is what a
     legacy task shows when it never went through draft/ready/etc; every
     task is folded to a real v3 state server-side, so this always applies. */
  .tstat { padding: 0 6px; border-radius: 3px; font-size: 11px; flex-shrink: 0; }
  .tstat.draft      { background: #1c1826; color: #9a8fb0; }
  .tstat.ready      { background: #33210f; color: #e0a153; }
  .tstat.doing      { background: #1a2733; color: #6aa5d8; }
  .tstat.review     { background: #2a1a33; color: #c98fe0; }
  .tstat.done       { background: #16291a; color: #7dc687; }
  .tstat.blocked    { background: #33150f; color: #e07a53; }
  .tstat.superseded { background: #1a1620; color: #5d5650; }
  .task.done .ttext, .task.superseded .ttext { color: #5d5650; text-decoration: line-through; }
  .trev {
    color: #56505a; font-size: 11px; flex-shrink: 0; border: 1px solid #2a2028;
    border-radius: 3px; padding: 0 4px;
  }
  .task button { padding: 1px 7px; font-size: 11px; }
  .towner { color: #5d7b5d; font-size: 11px; flex-shrink: 0; }
  .tmore {
    cursor: pointer; color: #6aa5d8; font-size: 11px; flex-shrink: 0;
    border-bottom: 1px dotted #6aa5d8;
  }
  .tmore:hover { color: #9ccbf0; }
  /* Files/acceptance/plan/notes detail - collapsed by default, own indented
     block so it never fights the dense summary row for space. */
  .tdetail {
    margin: 3px 0 0 38px; padding: 4px 0 4px 8px; border-left: 2px solid #241f2b;
    font-size: 12px; color: #a99bb8; display: flex; flex-direction: column; gap: 3px;
  }
  .tdetail .lbl { color: #6f6660; }
  .tdetail .plan-old { opacity: 0.6; }
  .tdetail .plan-old .lbl { color: #8a5050; }
  #taskadd { display: flex; gap: 8px; margin-top: 6px; }
  #ttext { flex: 1; }
  #spawnbar { border-top: 1px dashed #2a2028; }
  #sname { width: 130px; }
  #stask { flex: 1; }
  #spawn { background: #12301a; color: #7dc687; }
  #spawn:hover { background: #1a4525; }
  #spawn:disabled { opacity: 0.5; cursor: wait; }
  #loadarch {
    display: none; cursor: pointer; text-align: center;
    color: #6aa5d8; padding: 6px; border: 1px dashed #2a3a48;
    border-radius: 3px; margin-bottom: 8px;
  }
  #loadarch:hover { background: #14181f; }

  /* ── Fleet status panel (task #28) ──────────────────────────────────── */
  #fleettoggle { cursor: pointer; color: #6aa5d8; }
  #fleettoggle:hover { color: #9ccbf0; }
  #fleetpanel {
    display: none; position: absolute; top: 38px; right: 14px; z-index: 20;
    width: 420px; max-height: 60vh; overflow-y: auto;
    background: #14101a; border: 1px solid #2a2028; border-radius: 4px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5); padding: 6px;
  }
  .frow { padding: 5px 6px; border-bottom: 1px solid #1a1620; }
  .frow:last-child { border-bottom: none; }
  .fmain { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
  .fname { font-weight: bold; }
  /* Three independent facts, three columns - never fused into one badge.
     Conflating identity/presence/pane liveness is what caused the
     duplicate-fleet spawn incident earlier today. */
  .frole {
    padding: 0 5px; border-radius: 3px; font-size: 10px; flex-shrink: 0;
    text-transform: uppercase; letter-spacing: 0.3px;
  }
  .frole.planner     { background: #1c1826; color: #9a8fb0; }
  .frole.implementer { background: #1a2733; color: #6aa5d8; }
  .frole.reviewer    { background: #16291a; color: #7dc687; }
  .frole.verifier    { background: #33210f; color: #e0a153; }
  .frole.coordinator { background: #2a1a33; color: #c98fe0; }
  .frole.human    { background: #3a1712; color: #e8886f; }
  .frole.service  { background: #1a1620; color: #6f6660; }
  .frole.unknown  { background: #1a1620; color: #5d5650; }
  .fherdr { flex-shrink: 0; }
  .fstate { font-size: 11px; flex-shrink: 0; }
  .fstate.working { color: #7dc687; }
  .fstate.active  { color: #6aa5d8; }
  .fstate.quiet   { color: #8a7f74; }
  .fstate.stale   { color: #5d5650; }
  .fdetail {
    margin: 2px 0 0 2px; font-size: 12px; color: #a99bb8;
    display: flex; flex-direction: column; gap: 1px;
  }
  .fwork { color: #a99bb8; }
  .flease { color: #6f6660; font-size: 11px; }
  .fstatus { color: #6f6660; font-style: italic; }
  .fclaims { color: #5d7b5d; font-size: 11px; }
  #fleetpanel .fempty { color: #6f6660; padding: 8px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>GNIPAHELLIR BOARD</h1>
  <span id="stats"></span>
  <span id="tasktoggle"></span>
  <span id="fleettoggle">FLEET</span>
  <span id="roster"></span>
</header>
<div id="fleetpanel"></div>
<div id="tasks">
  <div id="tasklist"></div>
  <div id="taskadd">
    <input id="ttext" placeholder="new task&hellip;" autocomplete="off">
    <button id="tadd">Add Task</button>
  </div>
</div>
<div id="log"><div id="loadarch"></div></div>
<div id="warn"></div>
<footer id="spawnbar">
  <input id="sname" placeholder="topic a-z 0-9 - (e.g. raids)" required
         pattern="[A-Za-z0-9 _-]*[A-Za-z0-9][A-Za-z0-9 _-]*"
         title="agent topic - becomes claude-&lt;topic&gt;-&lt;hex&gt;. Letters, digits and dashes; spaces and underscores become dashes." autocomplete="off">
  <select id="smodel" title="model - cheaper models for routine work">
    <option value="fable">fable</option>
    <option value="opus">opus</option>
    <option value="sonnet">sonnet</option>
    <option value="haiku">haiku</option>
  </select>
  <input id="stask" placeholder="task for a new claude agent&hellip;" autocomplete="off">
  <button id="spawn">Spawn Agent</button>
</footer>
<footer>
  <input id="name" title="your name">
  <select id="kind"><option>msg</option><option>request</option></select>
  <span style="align-self:center;color:#6f6660">&rarr;</span>
  <select id="to"><option value="">anyone</option></select>
  <input id="text" placeholder="message&hellip;" autocomplete="off">
  <button id="send">Send</button>
</footer>
<script>
"use strict";
const $ = id => document.getElementById(id);
let cursor = 0;

const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hue = s => { let h = 0; for (const c of s) h = (h * 31 + c.codePointAt(0)) % 360; return h; };
const when = u => new Date(u * 1000).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});

const BULLET = /^(\s*)([-*•])\s+(.*)$/;
const NUMBER = /^(\s*)(\d{1,3}[.)])\s+(.*)$/;
const CLIP_LINES = 16;    // more lines than this gets a preview + show-more
const CLIP_CHARS = 900;   // ...and so does one very long unbroken line

// Block treatment only for posts that are actually long or actually
// multi-line.  Never re-flow one-line prose: a paragraph break appears
// only where the poster typed a blank line.
const isBlock = t => t.includes("\n") || t.length > 160;

// Poster text enters ONLY through textContent, so a message can never
// become markup — the formatter appends nothing but elements it builds
// itself.  Lines already starting with a bullet or "1." marker get a
// hanging indent; every other line is passed through under pre-wrap.
function formatText(text) {
  const frag = document.createDocumentFragment();
  for (const raw of text.split("\n")) {
    const line = raw.replace(/\s+$/, "");
    if (!line) {
      const gap = document.createElement("div");
      gap.className = "blank";
      frag.appendChild(gap);
      continue;
    }
    const hit = BULLET.exec(line) || NUMBER.exec(line);
    const row = document.createElement("div");
    if (hit) {
      row.className = "li";
      if (hit[1]) row.style.marginLeft = Math.min(hit[1].length, 8) * 6 + "px";
      const mark = document.createElement("span");
      mark.className = "mark";
      mark.textContent = hit[2];
      const body = document.createElement("span");
      body.textContent = hit[3];
      row.append(mark, body);
    } else {
      row.className = "ln";
      row.textContent = line;
    }
    frag.appendChild(row);
  }
  return frag;
}

// seq -> rendered .m element, so a later event (an accept, an amend) can
// patch a post that already scrolled by instead of needing a full re-render.
const messageEls = new Map();
// requester seq -> {agent, seq} of the message that accepted it - built up
// as `accepts` posts stream in, since the acceptance always arrives after
// the request it resolves.
const acceptedBy = new Map();

function addAcceptedBadge(div, info) {
  if (div.querySelector(".accepted")) return;   // already patched
  const b = document.createElement("span");
  b.className = "accepted";
  b.textContent = `✓ taken by ${info.agent}`;
  b.title = `accepted at #${info.seq}`;
  div.appendChild(b);
}

function render(m) {
  const div = document.createElement("div");
  const block = isBlock(m.text);
  div.className = "m" + (block ? " block" : "");
  div.innerHTML =
    `<span class="t">${when(m.unix)}</span>` +
    `<span class="seq">#${m.seq}</span>` +
    `<span class="agent" style="color:hsl(${hue(m.agent)} 45% 65%)">${esc(m.agent)}</span>` +
    `<span class="kind ${esc(m.kind)}">${esc(m.kind)}${m.reply_to ? "&#8594;#" + m.reply_to : ""}</span>` +
    (m.to ? `<span class="to">@${esc(m.to)}</span>` : "");

  if (m.task_id) {
    const link = document.createElement("span");
    link.className = "tasklink";
    link.textContent = `↳ #${m.task_id}`;
    link.title = `bound to task #${m.task_id} - click to jump to it`;
    link.onclick = () => jumpToTask(m.task_id);
    div.appendChild(link);
  }

  const txt = document.createElement(block ? "div" : "span");
  txt.className = "txt";
  if (block) txt.appendChild(formatText(m.text));
  else txt.textContent = m.text;
  div.appendChild(txt);

  // Clip on either axis: many lines, or one enormous unbroken line — the
  // wall-of-text posts that started this are single-line and 2000+ chars,
  // so a line count alone would never catch them.
  const lines = block ? m.text.split("\n").length : 1;
  if (lines > CLIP_LINES || m.text.length > CLIP_CHARS) {
    txt.classList.add("clip");
    const more = document.createElement("span");
    more.className = "more";
    const shut = lines > 1 ? `▾ show all ${lines} lines` : "▾ show more";
    const label = () => txt.classList.contains("clip") ? shut : "▴ collapse";
    more.textContent = label();
    more.onclick = () => { txt.classList.toggle("clip"); more.textContent = label(); };
    div.appendChild(more);
  }

  if (m.files && m.files.length) {
    const f = document.createElement("span");
    f.className = "files";
    f.textContent = "[" + m.files.join(", ") + "]";
    div.appendChild(f);
  }

  messageEls.set(m.seq, div);
  // An `anyone` request that was already accepted before this render (e.g.
  // loaded from the archive out of order) shows the badge immediately.
  if (acceptedBy.has(m.seq)) addAcceptedBadge(div, acceptedBy.get(m.seq));
  // This post IS an acceptance: record it, and patch the original request's
  // row live if it is still on screen.
  if (m.accepts) {
    const info = { agent: m.agent, seq: m.seq };
    acceptedBy.set(m.accepts, info);
    const target = messageEls.get(m.accepts);
    if (target) addAcceptedBadge(target, info);
  }
  return div;
}

let firstLiveSeq = 0;   // oldest seq the live board still serves
let archiveLoaded = false;

async function poll() {
  try {
    const d = await (await fetch("/delta?since=" + cursor)).json();
    if (d.messages.length) {
      const log = $("log");
      const stick = log.scrollHeight - log.scrollTop - log.clientHeight < 60;
      for (const m of d.messages) log.appendChild(render(m));
      if (stick) log.scrollTop = log.scrollHeight;
      $("stats").textContent = `latest #${d.latest}`;
      if (!firstLiveSeq) {
        firstLiveSeq = d.messages[0].seq;
        // Nothing is ever lost: anything trimmed off the live window sits
        // in the archive, loadable above the log.
        if (firstLiveSeq > 1 && !archiveLoaded) {
          const la = $("loadarch");
          la.textContent = `load archived history (#1–#${firstLiveSeq - 1})`;
          la.style.display = "block";
        }
      }
    }
    cursor = d.latest;
  } catch (e) { $("stats").textContent = "board unreachable"; }
}

async function loadArchive() {
  const la = $("loadarch"), log = $("log");
  la.textContent = "loading…";
  try {
    const msgs = await (await fetch("/archive")).json();
    const frag = document.createDocumentFragment();
    for (const m of msgs) frag.appendChild(render(m));
    const before = log.scrollHeight;
    log.insertBefore(frag, la.nextSibling);
    log.scrollTop += log.scrollHeight - before;
    archiveLoaded = true;
    la.style.display = "none";
  } catch (e) { la.textContent = "archive load failed - retry"; }
}

const HERDR_ICON = { working: "⚒", idle: "·", blocked: "✋", done: "✓" };

// Piggybacked by the fleet panel (#28) - the same 10s cycle that already
// fetches /agents and /herdr for the roster, so the panel costs zero extra
// polling. Populated every refreshAgents() tick regardless of whether the
// panel is open; refreshTasks() populates lastTasksAll the same way.
let lastAgentsAll = [];
let lastHerdr = {};
let lastTasksAll = [];

async function refreshAgents() {
  try {
    const all = await (await fetch("/agents")).json();
    lastAgentsAll = all;
    const active = all.filter(a => a.active);
    let herdr = {};
    try {
      for (const h of await (await fetch("/herdr")).json()) {
        if (h.name) herdr[h.name] = h;
      }
    } catch (e) {}
    lastHerdr = herdr;
    renderFleetPanel();
    const to = $("to"), kept = to.value;
    to.innerHTML = '<option value="">anyone</option>';
    for (const a of active) {
      const o = document.createElement("option");
      o.value = o.textContent = a.agent;
      to.appendChild(o);
    }
    to.value = [...to.options].some(o => o.value === kept) ? kept : "";
    // Union of board-active agents and herdr-named panes: a spawn that died
    // before checking in still shows up here, with its close button.
    const names = [...new Set([...active.map(a => a.agent), ...Object.keys(herdr)])];
    const byName = {};
    for (const a of active) byName[a.agent] = a;
    const roster = $("roster");
    roster.textContent = "active: ";
    roster.title = "herdr: ⚒ working · idle ✋ blocked ✓ done — ✕ closes a spawned agent's pane — ⊘ releases an agent's file claims";
    if (!names.length) roster.append("nobody");
    names.forEach((n, i) => {
      if (i) roster.append(", ");
      const h = herdr[n];
      roster.append(h ? `${n}[${HERDR_ICON[h.status] || h.status}]` : n);
      if (h) {
        const x = document.createElement("span");
        x.className = "rkill";
        x.textContent = "✕";
        x.title = `close ${n}'s herdr pane`;
        x.onclick = () => closeAgent(n);
        roster.appendChild(x);
      }
      // One-click broom for claims: dead sessions never say goodbye.
      const a = byName[n];
      if (a && a.files && a.files.length) {
        const r = document.createElement("span");
        r.className = "rrel";
        r.textContent = "⊘";
        r.title = `release ${n}'s file claims: ${a.files.join(", ")}`;
        r.onclick = () => releaseClaims(n, a.files);
        roster.appendChild(r);
      }
    });
  } catch (e) {}
}

async function send() {
  const text = $("text").value.trim();
  const agent = $("name").value.trim();
  if (!text || !agent) return;
  localStorage.setItem("board_name", agent);
  const r = await (await fetch("/post", {
    method: "POST",
    body: JSON.stringify({ agent, kind: $("kind").value, to: $("to").value, text }),
  })).json();
  const w = $("warn");
  w.style.display = r.warnings && r.warnings.length ? "block" : "none";
  w.textContent = (r.warnings || []).join(" | ");
  $("text").value = "";
  await poll();
}

// Claims release the same way agents release them: a files=[] status as that
// agent. The text names the operator so the log never reads as the agent's
// own words.
async function releaseClaims(name, files) {
  if (!confirm(`Release ${name}'s file claims?\n\n${files.join("\n")}`)) return;
  const operator = $("name").value.trim() || "glenn";
  await fetch("/post", {
    method: "POST",
    body: JSON.stringify({ agent: name, kind: "status", files: [],
      text: `(claims released from the board roster by ${operator})` }),
  });
  await poll();
  refreshAgents();
}

async function closeAgent(name) {
  if (!confirm(`Close ${name}'s session (herdr pane)?`)) return;
  const r = await (await fetch("/kill", { method: "POST", body: JSON.stringify({ name }) })).json();
  const w = $("warn");
  if (r.error) { w.style.display = "block"; w.textContent = "close failed: " + r.error; }
  await poll();
  refreshAgents();
}

let tasksOpen = false;
// Detail panels collapse by default and would otherwise flatten every 5s
// when refreshTasks rebuilds the list - remember what is open per task id.
const openMeta = new Set();
const openPlan = new Set();
const openNotes = new Set();
const planCache = new Map();   // message seq -> message (or null: fetched, missing)

// v3 lifecycle order for sorting: active work first, terminal work last.
const STATE_ORDER = { Blocked: 0, Doing: 1, Review: 2, Ready: 3, Draft: 4, Done: 5, Superseded: 6 };

// What a task can legally do FROM its current state - mirrors the server's
// own switch in handle_task_mut, so a click never offers a 409.
function stateActions(t) {
  switch (t.state) {
    case "Draft":  return [["ready", "ready"]];
    case "Ready":  return [["claim", "claim"]];
    case "Doing":  return [["renew", "renew"], ["release", "release"], ["submit", "submit"],
                            ...(t.origin !== "v3" ? [["force-done", "done"]] : [])];
    case "Review": return [["approve", "approve"], ["rework", "rework"]];
    case "Blocked":return [["unblock", "unblock"]];
    case "Done":   return [["reopen", "reopen"]];
    default:       return [];   // Superseded is terminal - it points elsewhere instead
  }
}

async function refreshTasks() {
  try {
    const ts = await (await fetch("/tasks")).json();
    lastTasksAll = ts;
    renderFleetPanel();
    const open = ts.filter(t => t.state !== "Done" && t.state !== "Superseded").length;
    $("tasktoggle").textContent = `tasks: ${open} open ${tasksOpen ? "▴" : "▾"}`;
    if (!tasksOpen) return;
    const tl = $("tasklist");
    tl.innerHTML = "";
    for (const t of [...ts].sort((a, b) => STATE_ORDER[a.state] - STATE_ORDER[b.state] || b.id - a.id)) {
      tl.appendChild(renderTask(t));
    }
  } catch (e) {}
}

function renderTask(t) {
  const div = document.createElement("div");
  div.id = `task-${t.id}`;
  div.className = "task" + (t.state === "Done" || t.state === "Superseded" ? " " + t.state.toLowerCase() : "");

  const row = document.createElement("div");
  row.className = "trow";
  row.innerHTML =
    `<span class="tid">#${t.id}</span>` +
    `<span class="tstat ${t.state.toLowerCase()}">${esc(t.state)}</span>` +
    `<span class="trev">rev ${t.rev || 1}</span>` +
    `<span class="ttext">${esc(t.text)}</span>` +
    `<span class="towner">${esc(t.creator)}${t.owner ? " → " + esc(t.owner) : ""}</span>`;

  if (t.state === "Blocked" && t.blocked_from) {
    const b = document.createElement("span");
    b.className = "towner";
    b.textContent = `(from ${t.blocked_from})`;
    row.appendChild(b);
  }
  if (t.state === "Superseded" && t.superseded_by) {
    const s = document.createElement("span");
    s.className = "tasklink";
    s.textContent = `→ #${t.superseded_by}`;
    s.title = "superseded by this task";
    s.onclick = () => jumpToTask(t.superseded_by);
    row.appendChild(s);
  }

  for (const [label, action] of stateActions(t)) {
    const b = document.createElement("button");
    b.textContent = label;
    b.onclick = () => taskAct(action, t);
    row.appendChild(b);
  }

  const hasMeta = (t.files && t.files.length) || t.accept;
  const hasPlan = t.plan_seqs && t.plan_seqs.length;
  const hasNotes = t.notes && t.notes.length;
  if (hasMeta) row.appendChild(toggle(`files/accept`, openMeta, t.id, refreshTasks));
  if (hasPlan) row.appendChild(toggle(`plan (${t.plan_seqs.length})`, openPlan, t.id, refreshTasks));
  if (hasNotes) row.appendChild(toggle(`${t.notes.length} note${t.notes.length > 1 ? "s" : ""}`, openNotes, t.id, refreshTasks));
  div.appendChild(row);

  if (hasMeta && openMeta.has(t.id)) div.appendChild(metaDetail(t));
  if (hasNotes && openNotes.has(t.id)) div.appendChild(notesDetail(t));
  if (hasPlan && openPlan.has(t.id)) div.appendChild(planDetail(t));   // async fill-in

  return div;
}

// A small "label ▾/▴" span that flips a per-task Set membership and re-renders.
function toggle(label, set, id, onchange) {
  const s = document.createElement("span");
  s.className = "tmore";
  const paint = () => { s.textContent = `${label} ${set.has(id) ? "▴" : "▾"}`; };
  paint();
  s.onclick = () => { set.has(id) ? set.delete(id) : set.add(id); onchange(); };
  return s;
}

function metaDetail(t) {
  const d = document.createElement("div");
  d.className = "tdetail";
  if (t.files && t.files.length) {
    const f = document.createElement("div");
    f.innerHTML = `<span class="lbl">files:</span> ${esc(t.files.join(", "))}`;
    d.appendChild(f);
  }
  if (t.accept) {
    const a = document.createElement("div");
    a.innerHTML = `<span class="lbl">acceptance:</span> ${esc(t.accept)}`;
    d.appendChild(a);
  }
  return d;
}

function notesDetail(t) {
  const d = document.createElement("div");
  d.className = "tdetail";
  for (const n of t.notes) {
    const row = document.createElement("div");
    row.innerHTML = `<span class="lbl">·</span> ${esc(n)}`;
    d.appendChild(row);
  }
  return d;
}

// The task's own `text` IS the latest amended contract (the server never
// keeps the pre-amendment string). What CAN be recovered is the plan trail:
// plan_seqs is an ordered list of board-message seqs, last one binding. This
// fetches each on first expand and caches it - a plan post never changes.
function planDetail(t) {
  const d = document.createElement("div");
  d.className = "tdetail";
  d.textContent = "loading plan…";
  (async () => {
    const seqs = t.plan_seqs;
    const msgs = await Promise.all(seqs.map(fetchMessageBySeq));
    d.innerHTML = "";
    seqs.forEach((seq, i) => {
      const m = msgs[i];
      const last = i === seqs.length - 1;
      const row = document.createElement("div");
      row.className = last ? "plan-cur" : "plan-old";
      const lbl = document.createElement("span");
      lbl.className = "lbl";
      lbl.textContent = last ? `plan #${seq} (binding):` : `plan #${seq} (superseded):`;
      row.appendChild(lbl);
      row.appendChild(document.createTextNode(" "));
      if (m) row.appendChild(formatText(m.text));
      else row.appendChild(document.createTextNode("(not found - may predate the live window)"));
      d.appendChild(row);
    });
  })();
  return d;
}

async function fetchMessageBySeq(seq) {
  if (planCache.has(seq)) return planCache.get(seq);
  let found = null;
  try {
    const d = await (await fetch(`/delta?since=${seq - 1}`)).json();
    found = d.messages.find(m => m.seq === seq) || null;
  } catch (e) {}
  planCache.set(seq, found);
  return found;
}

// Jump from a task-bound message, or a superseded-by chip, to the task's row.
function jumpToTask(id) {
  tasksOpen = true;
  $("tasks").style.display = "block";
  refreshTasks();
  requestAnimationFrame(() => {
    const el = $(`task-${id}`);
    if (!el) return;
    el.scrollIntoView({ block: "center" });
    el.classList.add("task-flash");
    setTimeout(() => el.classList.remove("task-flash"), 1400);
  });
}

async function taskAct(action, t) {
  const agent = $("name").value.trim() || "glenn";
  const body = { action, id: t.id, agent, rev: t.rev || 0 };
  const r = await (await fetch("/task", { method: "POST", body: JSON.stringify(body) })).json();
  if (r.error) {
    const w = $("warn");
    w.style.display = "block";
    w.textContent = `task #${t.id} ${action} failed: ${r.error}`;
  }
  refreshTasks();
}

async function taskAdd() {
  const text = $("ttext").value.trim();
  const agent = $("name").value.trim() || "glenn";
  if (!text) return;
  await fetch("/task", { method: "POST", body: JSON.stringify({ action: "add", text, agent }) });
  $("ttext").value = "";
  refreshTasks();
}

// ── Fleet status panel (task #28) ───────────────────────────────────────
// Merges three already-polled sources client-side: GET /agents (identity +
// presence), GET /tasks (owned work, the rev-gated leased truth), GET /herdr
// (pane liveness). Deliberately does NOT fuse them into one badge - identity,
// presence and pane are different machine facts, and conflating them is what
// produced the duplicate-fleet spawn incident earlier today.

const KNOWN_ROLES = new Set(["planner", "implementer", "reviewer", "verifier", "coordinator"]);

// glenn (the human) and board (the service) are not under-registered agents;
// they simply are not agents, and the panel should say so rather than render
// them as broken registrations.
function fleetRoleTag(agent, role) {
  if (agent === "glenn") return { cls: "human", label: "human" };
  if (agent === "board") return { cls: "service", label: "service" };
  if (KNOWN_ROLES.has(role)) return { cls: role, label: role };
  return { cls: "unknown", label: role || "—" };
}

function fleetState(a, now, ownedTask) {
  if (ownedTask) return { cls: "working", label: "working" };
  if (a.active) return { cls: "active", label: "active" };
  if (a.role || a.model) return { cls: "quiet", label: "quiet" };
  const mins = Math.max(0, Math.round((now - a.last_seen) / 60));
  return { cls: "stale", label: `stale ${mins}m` };
}

function fleetRow(a, now) {
  const div = document.createElement("div");
  div.className = "frow";

  // Owned non-terminal task wins as "what they are working on" - it is
  // rev-gated, leased truth. Status text is prose and only a fallback.
  const owned = lastTasksAll.find(t => t.owner === a.agent && (t.state === "Doing" || t.state === "Review"));
  const state = fleetState(a, now, owned);
  const role = fleetRoleTag(a.agent, a.role);
  const herdr = lastHerdr[a.agent];

  const main = document.createElement("div");
  main.className = "fmain";
  const roleTag = document.createElement("span");
  roleTag.className = "frole " + role.cls;
  roleTag.textContent = role.label;
  main.appendChild(roleTag);
  const name = document.createElement("span");
  name.className = "fname";
  name.textContent = a.agent;
  main.appendChild(name);
  if (herdr) {
    const h = document.createElement("span");
    h.className = "fherdr";
    h.textContent = HERDR_ICON[herdr.status] || herdr.status;
    h.title = `herdr pane: ${herdr.status}`;
    main.appendChild(h);
  }
  const st = document.createElement("span");
  st.className = "fstate " + state.cls;
  st.textContent = state.label;
  main.appendChild(st);
  if (a.model) {
    const m = document.createElement("span");
    m.className = "flease";
    m.textContent = a.model;
    main.appendChild(m);
  }
  div.appendChild(main);

  const detail = document.createElement("div");
  detail.className = "fdetail";
  let any = false;
  if (owned) {
    any = true;
    const w = document.createElement("div");
    w.className = "fwork";
    const left = owned.state === "Doing" && owned.lease_until
      ? ` (${Math.max(0, Math.round((owned.lease_until - now) / 60))}m left)` : "";
    w.textContent = `#${owned.id}: ${owned.text}${left}`;
    detail.appendChild(w);
  }
  if (a.status) {
    any = true;
    const s = document.createElement("div");
    s.className = "fstatus";
    s.textContent = a.status.split("\n")[0];
    detail.appendChild(s);
  }
  if (a.files && a.files.length) {
    any = true;
    const c = document.createElement("div");
    c.className = "fclaims";
    c.textContent = "[" + a.files.join(", ") + "]";
    detail.appendChild(c);
  }
  if (any) div.appendChild(detail);
  return div;
}

let fleetOpen = false;

function renderFleetPanel() {
  const panel = $("fleetpanel");
  if (!fleetOpen) return;
  panel.innerHTML = "";
  if (!lastAgentsAll.length) {
    const e = document.createElement("div");
    e.className = "fempty";
    e.textContent = "no agents yet";
    panel.appendChild(e);
    return;
  }
  const now = Date.now() / 1000;
  // Working first, then active, then quiet, then stale - matches the state
  // precedence, so the agents doing something are always at the top.
  const order = { working: 0, active: 1, quiet: 2, stale: 3 };
  const rows = [...lastAgentsAll].sort((a, b) => {
    const oa = lastTasksAll.find(t => t.owner === a.agent && (t.state === "Doing" || t.state === "Review"));
    const ob = lastTasksAll.find(t => t.owner === b.agent && (t.state === "Doing" || t.state === "Review"));
    return order[fleetState(a, now, oa).cls] - order[fleetState(b, now, ob).cls]
      || a.agent.localeCompare(b.agent);
  });
  for (const a of rows) panel.appendChild(fleetRow(a, now));
}

function openFleetPanel() {
  fleetOpen = true;
  $("fleetpanel").style.display = "block";
  renderFleetPanel();
}

function closeFleetPanel() {
  fleetOpen = false;
  $("fleetpanel").style.display = "none";
}

let fleetCloseTimer = null;
function armFleetClose() {
  clearTimeout(fleetCloseTimer);
  fleetCloseTimer = setTimeout(closeFleetPanel, 300);
}
function cancelFleetClose() {
  clearTimeout(fleetCloseTimer);
}

// Hover for mouse users; click for touch/keyboard, since hover does not
// exist there.
$("fleettoggle").addEventListener("mouseenter", () => { cancelFleetClose(); openFleetPanel(); });
$("fleettoggle").addEventListener("mouseleave", armFleetClose);
$("fleetpanel").addEventListener("mouseenter", cancelFleetClose);
$("fleetpanel").addEventListener("mouseleave", armFleetClose);
$("fleettoggle").addEventListener("click", () => { fleetOpen ? closeFleetPanel() : openFleetPanel(); });

$("tasktoggle").addEventListener("click", () => {
  tasksOpen = !tasksOpen;
  $("tasks").style.display = tasksOpen ? "block" : "none";
  refreshTasks();
});
$("tadd").addEventListener("click", taskAdd);
$("ttext").addEventListener("keydown", e => { if (e.key === "Enter") taskAdd(); });

async function spawnAgent() {
  const prompt = $("stask").value.trim();
  const name = $("sname").value.trim();
  const btn = $("spawn"), w = $("warn");
  // Fail AT THE FORM, and say why. The server refuses a missing topic now
  // (it used to invent one and launch a real agent), but a human should not
  // have to send a request to find out. Both fields are checked here rather
  // than only the topic: `if (!prompt) return` was a SILENT no-op - the
  // button did nothing and explained nothing, which is the same sin one
  // layer up from the default topic this task exists to delete.
  const missing = !name ? "a topic" : !prompt ? "a task" : "";
  if (missing) {
    w.style.display = "block";
    w.textContent = "spawn needs " + missing;
    $(!name ? "sname" : "stask").focus();
    return;
  }
  btn.disabled = true;
  try {
    const r = await (await fetch("/spawn", {
      method: "POST",
      body: JSON.stringify({ name, prompt, model: $("smodel").value }),
    })).json();
    if (r.error) {
      w.style.display = "block";
      w.textContent = "spawn failed: " + r.error;
    } else {
      w.style.display = "none";
      $("stask").value = "";
      await poll();
    }
  } catch (e) {
    w.style.display = "block";
    w.textContent = "spawn failed: board unreachable";
  } finally { btn.disabled = false; }
}

$("spawn").addEventListener("click", spawnAgent);
$("stask").addEventListener("keydown", e => { if (e.key === "Enter") spawnAgent(); });
$("send").addEventListener("click", send);
$("loadarch").addEventListener("click", loadArchive);
$("text").addEventListener("keydown", e => { if (e.key === "Enter") send(); });
$("name").value = localStorage.getItem("board_name") || "glenn";

poll().then(() => { const log = $("log"); log.scrollTop = log.scrollHeight; });
refreshAgents();
refreshTasks();
setInterval(poll, 2500);
setInterval(refreshAgents, 10000);
setInterval(refreshTasks, 5000);
</script>
